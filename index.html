<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Racing Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- Score -->
        <div class="top-bar">
            SCORE: <span id="score">0</span>
        </div>

        <!-- Game -->
        <div id="road">

            <!-- Road lines -->
            <div class="road-line line1"></div>
            <div class="road-line line2"></div>
            <div class="road-line line3"></div>
            <div class="road-line line4"></div>

            <!-- Player car -->
            <div id="player" class="car player-car">

                <div class="car-window"></div>

                <div class="wheel left-wheel"></div>
                <div class="wheel right-wheel"></div>

            </div>

            <!-- Enemy car 1 -->
            <div id="enemy1" class="car enemy-car">

                <div class="car-window"></div>

                <div class="wheel left-wheel"></div>
                <div class="wheel right-wheel"></div>

            </div>

            <!-- Enemy car 2 -->
            <div id="enemy2" class="car enemy-car enemy2">

                <div class="car-window"></div>

                <div class="wheel left-wheel"></div>
                <div class="wheel right-wheel"></div>

            </div>

        </div>

        <!-- Phone controls -->
        <div class="controls">

            <button id="leftButton">
                ⬅ LEFT
            </button>

            <button id="rightButton">
                RIGHT ➡
            </button>

        </div>

        <!-- Game over -->
        <div id="gameOver">

            <h1>GAME OVER</h1>

            <p>
                Your Score:
                <span id="finalScore">0</span>
            </p>

            <button id="restartButton">
                PLAY AGAIN
            </button>

        </div>

    </div>

    <!-- IMPORTANT: your file is script.js -->
    <script src="script.js"></script>

</body>
